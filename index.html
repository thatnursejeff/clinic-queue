<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PHMU-Q</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

  <div class="flex justify-center space-x-4 mb-6">
    <button onclick="showTab('register')" class="px-4 py-2 bg-white shadow rounded-lg font-bold">Registration</button>
    <button onclick="showTab('nurse')" class="px-4 py-2 bg-white shadow rounded-lg font-bold">Nurse Queue</button>
    <button onclick="showTab('tv')" class="px-4 py-2 bg-white shadow rounded-lg font-bold">Public Display</button>
  </div>

  <div id="nurse-tab" class="max-w-5xl mx-auto space-y-6">
    <div class="grid grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl shadow">
        <p class="text-sm text-gray-500">Waiting</p>
        <p id="count-waiting" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow">
        <p class="text-sm text-gray-500">With Nurses</p>
        <p id="count-nurse" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow">
        <p class="text-sm text-gray-500">Completed</p>
        <p id="count-completed" class="text-3xl font-bold">0</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-bold mb-4">Waiting Clients</h2>
      <div id="queue-list" class="space-y-3"></div>
    </div>
  </div>

  <div id="tv-tab" class="hidden fixed inset-0 bg-white flex items-center justify-center">
    <div id="tv-number" class="text-[18vw] font-extrabold tracking-tight text-black">
      --
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzFERiN6WqTFbsUsWsvTAG8J4ZE6EU7YQNoqHJwviahJGPCtrOo-bpyxOjq9jF40aug/exec
";

    async function fetchQueue() {
      const res = await fetch(API_URL);
      const data = await res.json();

      // Update Stat Counts
      document.getElementById('count-waiting').innerText = data.filter(r => r.Status === 'Waiting').length;
      document.getElementById('count-nurse').innerText = data.filter(r => r.Status === 'With Nurse').length;
      document.getElementById('count-completed').innerText = data.filter(r => r.Status === 'Completed').length;

      // Render Nurse Queue
      const queueList = document.getElementById('queue-list');
      queueList.innerHTML = '';

      data.filter(r => r.Status === 'Waiting').forEach(item => {
        queueList.innerHTML += `
          <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border">
            <div>
              <span class="text-2xl font-bold mr-4">${item.TicketNumber}</span>
              <span class="text-gray-700 font-medium">${item.Service}</span>
              <span class="text-sm text-gray-400 ml-2">(${item.ApptType})</span>
            </div>
            <button onclick="callPatient('${item.TicketNumber}')" class="bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-800">
              Call to Station A
            </button>
          </div>
        `;
      });

      // Render Public Display TV Number (Latest Called)
      const lastCalled = data.filter(r => r.Status === 'With Nurse').pop();
      if (lastCalled) {
        document.getElementById('tv-number').innerText = `${lastCalled.TicketNumber} - ${lastCalled.StationID || 'A'}`;
      }
    }

    async function callPatient(ticketNum) {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'call', ticketNum: ticketNum, stationId: 'Station A' })
      });
      fetchQueue();
    }

    function showTab(tab) {
      if (tab === 'tv') {
        document.getElementById('tv-tab').classList.remove('hidden');
      } else {
        document.getElementById('tv-tab').classList.add('hidden');
      }
    }

    // Auto Refresh Queue Data every 3 seconds
    setInterval(fetchQueue, 3000);
    fetchQueue();
  </script>
</body>
</html>
