E<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Queue Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

  <div class="flex justify-center space-x-4 mb-6">
    <button onclick="switchTab('register')" id="btn-register" class="px-5 py-2.5 bg-white text-gray-800 font-semibold rounded-xl shadow-sm border hover:bg-gray-50">Registration</button>
    <button onclick="switchTab('nurse')" id="btn-nurse" class="px-5 py-2.5 bg-white text-gray-800 font-semibold rounded-xl shadow-sm border hover:bg-gray-50">Nurse Queue</button>
    <button onclick="switchTab('display')" id="btn-display" class="px-5 py-2.5 bg-white text-gray-800 font-semibold rounded-xl shadow-sm border hover:bg-gray-50">Public Display</button>
  </div>

  <div id="screen-register" class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-sm border">
    <h2 class="text-xl font-bold text-gray-800 mb-1">Register New Arrival</h2>
    <p class="text-sm text-gray-500 mb-6">Enter ticket details to add client to the live queue.</p>

    <form id="regForm" onsubmit="submitRegistration(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Ticket Number</label>
        <input type="text" id="ticketNum" required placeholder="e.g. 101" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-black outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Service Required</label>
        <select id="service" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-black outline-none bg-white">
          <option value="Vaccination">Vaccination</option>
          <option value="STI screening and care">STI screening and care</option>
          <option value="Flu Shot">Flu Shot</option>
          <option value="General Consultation">General Consultation</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Appointment Type</label>
        <div class="flex space-x-4 mt-1">
          <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="appType" value="Booked appointment" checked class="w-4 h-4 text-black">
            <span>Booked appointment</span>
          </label>
          <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="appType" value="Drop-in walk-in" class="w-4 h-4 text-black">
            <span>Drop-in walk-in</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Appointment Time</label>
        <input type="time" id="appTime" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-black outline-none">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-black text-white py-3 rounded-xl font-semibold hover:bg-gray-800 transition">
        Issue ticket and add to queue
      </button>
      <p id="alertMsg" class="text-sm font-bold text-green-600 hidden text-center mt-2">✓ Patient added to queue!</p>
    </form>
  </div>

  <div id="screen-nurse" class="hidden max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border flex items-center justify-between">
      <span class="text-sm font-semibold text-gray-700">Your Station:</span>
      <select id="stationSelect" class="p-2 border rounded-lg font-bold text-gray-800 bg-gray-50 outline-none">
        <option value="Station A">Station A</option>
        <option value="Station B">Station B</option>
        <option value="Station C">Station C</option>
      </select>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border">
        <p class="text-xs text-gray-500 font-semibold uppercase">Waiting</p>
        <p id="count-waiting" class="text-3xl font-bold text-gray-900 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border">
        <p class="text-xs text-gray-500 font-semibold uppercase">With Nurses</p>
        <p id="count-nurse" class="text-3xl font-bold text-gray-900 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border">
        <p class="text-xs text-gray-500 font-semibold uppercase">Completed</p>
        <p id="count-completed" class="text-3xl font-bold text-gray-900 mt-1">0</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border">
      <h3 class="text-lg font-bold text-gray-800 mb-1">Waiting Clients</h3>
      <p class="text-xs text-gray-500 mb-4">Booked appointments appear first, followed by drop-ins.</p>
      <div id="queue-list" class="space-y-3">
        <p class="text-sm text-gray-400">Loading queue...</p>
      </div>
    </div>
  </div>

  <div id="screen-display" class="hidden fixed inset-0 bg-white flex flex-col items-center justify-center">
    <p class="text-2xl font-semibold text-gray-400 uppercase tracking-widest mb-4">Now Serving</p>
    <div id="display-number" class="text-[18vw] font-black tracking-tight text-black leading-none">
      --
    </div>
  </div>

    <script>
    const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    function switchTab(tabName) {
      // 1. Force hide all screens using inline style overrides
      document.getElementById('screen-register').style.display = 'none';
      document.getElementById('screen-nurse').style.display = 'none';
      document.getElementById('screen-display').style.display = 'none';

      // 2. Display selected screen
      if (tabName === 'register') {
        document.getElementById('screen-register').style.display = 'block';
      } else if (tabName === 'nurse') {
        document.getElementById('screen-nurse').style.display = 'block';
        try { fetchQueue(); } catch(e) { console.error(e); }
      } else if (tabName === 'display') {
        document.getElementById('screen-display').style.display = 'flex';
        try { fetchQueue(); } catch(e) { console.error(e); }
      }
    }

    async function fetchQueue() {
      if (!API_URL || API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
      
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        // Safe filtering (handles missing or null values gracefully)
        const waiting = data.filter(r => r && String(r.Status || '').trim() === 'Waiting');
        
        document.getElementById('count-waiting').innerText = waiting.length;
        document.getElementById('count-nurse').innerText = data.filter(r => r && String(r.Status || '').trim() === 'With Nurse').length;
        document.getElementById('count-completed').innerText = data.filter(r => r && String(r.Status || '').trim() === 'Completed').length;

        const queueList = document.getElementById('queue-list');
        queueList.innerHTML = '';

        if (waiting.length === 0) {
          queueList.innerHTML = '<p class="text-sm text-gray-400 italic">No clients currently waiting.</p>';
        } else {
          waiting.forEach(item => {
            const ticket = item.TicketNumber || item.Ticketnumber || 'N/A';
            const service = item.Service || 'General';
            const appt = item.ApptType || '';
            const time = item.ApptTime ? '• ' + item.ApptTime : '';

            queueList.innerHTML += `
              <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border">
                <div class="flex items-center space-x-4">
                  <span class="text-2xl font-black text-black">${ticket}</span>
                  <div>
                    <p class="font-bold text-gray-800 text-sm">${service}</p>
                    <p class="text-xs text-gray-500">${appt} ${time}</p>
                  </div>
                </div>
                <button onclick="callPatient('${ticket}')" class="bg-black text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-gray-800 transition">
                  Call Patient
                </button>
              </div>
            `;
          });
        }

        const lastCalled = data.filter(r => r && String(r.Status || '').trim() === 'With Nurse').pop();
        if (lastCalled) {
          const calledTicket = lastCalled.TicketNumber || lastCalled.Ticketnumber || '';
          document.getElementById('display-number').innerText = `${calledTicket} - ${lastCalled.StationID || 'A'}`;
        }
      } catch (err) {
        console.warn("Queue update pending API response...", err);
      }
    }

    async function submitRegistration(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertMsg = document.getElementById('alertMsg');
      btn.innerText = "Adding...";
      btn.disabled = true;

      const payload = {
        action: 'add',
        ticketNum: document.getElementById('ticketNum').value,
        service: document.getElementById('service').value,
        appType: document.querySelector('input[name="appType"]:checked').value,
        appTime: document.getElementById('appTime').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
      } catch(err) {
        console.error(err);
      }

      document.getElementById('regForm').reset();
      btn.innerText = "Issue ticket and add to queue";
      btn.disabled = false;

      alertMsg.classList.remove('hidden');
      setTimeout(() => alertMsg.classList.add('hidden'), 3000);
    }

    async function callPatient(ticketNum) {
      const station = document.getElementById('stationSelect').value;
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'call', ticketNum: ticketNum, stationId: station })
        });
      } catch(err) {
        console.error(err);
      }
      setTimeout(fetchQueue, 1000);
    }

    // Set view immediately on load
    switchTab('register');
    setInterval(fetchQueue, 4000);
  </script>

</body>
</html>
