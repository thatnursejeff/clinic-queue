<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwcLsuz147a8DUXcRtMSqfVOmlBAOgeKzShTEoEK-5ySbX_ck9bYh7G-dgwhLOPAE2_gQ/exec";
    let activePatient = null;
    let lastAnnouncedTicket = null;

    // Audio Chime & Speech Synthesis (Only triggered by Public Display view)
    function playChimeAndAnnounce(ticketNum, stationId) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, start, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + start + duration);
          osc.stop(audioCtx.currentTime + start + duration);
        };
        playTone(523.25, 0, 0.6); // C5
        playTone(659.25, 0.3, 0.8); // E5

        setTimeout(() => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const text = `Now serving number ${ticketNum} at ${stationId}`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
          }
        }, 1000);
      } catch (e) {
        console.error("Audio playback error:", e);
      }
    }

    function switchTab(tabName) {
      document.getElementById('screen-register').style.display = 'none';
      document.getElementById('screen-nurse').style.display = 'none';
      document.getElementById('screen-display').style.display = 'none';

      if (tabName === 'register') {
        document.getElementById('screen-register').style.display = 'block';
      } else if (tabName === 'nurse') {
        document.getElementById('screen-nurse').style.display = 'block';
        fetchQueue();
      } else if (tabName === 'display') {
        document.getElementById('screen-display').style.display = 'flex';
        fetchQueue();
      }
    }

    async function fetchQueue() {
      if (!API_URL) return;
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const waiting = data.filter(r => r && String(r.Status || '').trim() === 'Waiting');
        document.getElementById('count-waiting').innerText = waiting.length;
        document.getElementById('count-nurse').innerText = data.filter(r => r && String(r.Status || '').trim() === 'With Nurse').length;
        document.getElementById('count-completed').innerText = data.filter(r => r && String(r.Status || '').trim() === 'Completed').length;

        const currentStation = document.getElementById('stationSelect').value;
        const myActive = data.find(r => r && String(r.Status || '').trim() === 'With Nurse' && r.StationID === currentStation);

        const activeBox = document.getElementById('active-client-box');
        if (myActive) {
          activePatient = myActive;
          const ticket = myActive.TicketNumber || myActive.Ticketnumber || 'N/A';
          document.getElementById('active-ticket-num').innerText = ticket;
          document.getElementById('active-service').innerText = myActive.Service || '';
          document.getElementById('active-appt-info').innerText = `${myActive.ApptType || ''} ${myActive.ApptTime ? '• ' + myActive.ApptTime : ''}`;
          activeBox.classList.remove('hidden');
        } else {
          activePatient = null;
          activeBox.classList.add('hidden');
        }

        const queueList = document.getElementById('queue-list');
        queueList.innerHTML = '';

        if (waiting.length === 0) {
          queueList.innerHTML = '<p class="text-sm text-gray-400 italic">No clients currently waiting.</p>';
        } else {
          waiting.forEach(item => {
            const ticket = item.TicketNumber || item.Ticketnumber || 'N/A';
            const service = item.Service || '';
            const apptType = item.ApptType || '';
            const apptTime = item.ApptTime ? ' • ' + item.ApptTime : '';

            const row = document.createElement('div');
            row.className = "flex items-center justify-between p-4 bg-gray-50 rounded-xl border";
            row.innerHTML = `
              <div class="flex items-center space-x-4">
                <span class="text-2xl font-black text-black">${ticket}</span>
                <div>
                  <p class="font-bold text-gray-800 text-sm">${service}</p>
                  <p class="text-xs text-gray-500">${apptType}${apptTime}</p>
                </div>
              </div>
              <button class="bg-black text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-gray-800 transition">
                Call Patient
              </button>
            `;
            
            row.querySelector('button').onclick = function() {
              callPatient(ticket);
            };

            queueList.appendChild(row);
          });
        }

        const calledPatients = data
          .filter(r => r && String(r.Status || '').trim() === 'With Nurse')
          .reverse();

        const primaryBox = document.getElementById('display-primary');
        const sec1 = document.getElementById('display-secondary-1');
        const sec2 = document.getElementById('display-secondary-2');

        const isDisplayActive = document.getElementById('screen-display').style.display !== 'none';

        if (calledPatients[0]) {
          const t0 = calledPatients[0].TicketNumber || calledPatients[0].Ticketnumber || '';
          const s0 = calledPatients[0].StationID || 'Station A';
          primaryBox.innerHTML = `
            <span class="text-8xl font-black tracking-tight leading-none">${t0}</span>
            <span class="text-2xl font-bold text-gray-300 mt-4">${s0}</span>
          `;

          // Trigger audio ONLY if the Public Display screen is active on this tab/device
          if (lastAnnouncedTicket !== t0 && isDisplayActive) {
            lastAnnouncedTicket = t0;
            playChimeAndAnnounce(t0, s0);
          }
        } else {
          primaryBox.innerHTML = `<span class="text-6xl font-black text-gray-600">--</span>`;
        }

        if (calledPatients[1]) {
          const t1 = calledPatients[1].TicketNumber || calledPatients[1].Ticketnumber || '';
          const s1 = calledPatients[1].StationID || '';
          sec1.innerHTML = `
            <p class="text-xs font-semibold text-gray-400 uppercase mb-1">Previous Call</p>
            <span class="text-3xl font-black">${t1}</span>
            <p class="text-xs text-gray-400 font-bold">${s1}</p>
          `;
        } else {
          sec1.innerHTML = `<p class="text-xs font-semibold text-gray-400 uppercase mb-1">Previous Call</p><span class="text-2xl font-bold text-gray-600">--</span>`;
        }

        if (calledPatients[2]) {
          const t2 = calledPatients[2].TicketNumber || calledPatients[2].Ticketnumber || '';
          const s2 = calledPatients[2].StationID || '';
          sec2.innerHTML = `
            <p class="text-xs font-semibold text-gray-400 uppercase mb-1">Previous Call</p>
            <span class="text-3xl font-black">${t2}</span>
            <p class="text-xs text-gray-400 font-bold">${s2}</p>
          `;
        } else {
          sec2.innerHTML = `<p class="text-xs font-semibold text-gray-400 uppercase mb-1">Previous Call</p><span class="text-2xl font-bold text-gray-600">--</span>`;
        }

      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    async function submitRegistration(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertMsg = document.getElementById('alertMsg');
      btn.innerText = "Adding...";
      btn.disabled = true;

      const payload = {
        action: 'add',
        ticketNum: document.getElementById('ticketNum').value,
        service: document.getElementById('service').value,
        appType: document.querySelector('input[name="appType"]:checked').value,
        appTime: document.getElementById('appTime').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Submission error:", err);
      }

      document.getElementById('regForm').reset();
      btn.innerText = "Issue ticket and add to queue";
      btn.disabled = false;

      alertMsg.classList.remove('hidden');
      setTimeout(() => alertMsg.classList.add('hidden'), 3000);
      setTimeout(fetchQueue, 1000);
    }

    async function callPatient(ticketNum) {
      const station = document.getElementById('stationSelect').value;
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'call', ticketNum: ticketNum, stationId: station })
        });
      } catch (err) {
        console.error("Call error:", err);
      }
      setTimeout(fetchQueue, 1000);
    }

    function recallCurrentPatient() {
      if (!activePatient) return;
      const ticket = activePatient.TicketNumber || activePatient.Ticketnumber;
      lastAnnouncedTicket = null;
      callPatient(ticket);
    }

    async function completeCurrentPatient() {
      if (!activePatient) return;
      const ticket = activePatient.TicketNumber || activePatient.Ticketnumber;
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'complete', ticketNum: ticket })
        });
      } catch (err) {
        console.error("Completion error:", err);
      }
      document.getElementById('active-client-box').classList.add('hidden');
      activePatient = null;
      setTimeout(fetchQueue, 1000);
    }

    setInterval(fetchQueue, 3000);
  </script>
