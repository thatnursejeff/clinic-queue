<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaxxy-Pad - Nova Scotia Publicly Funded Immunization Guide</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Wispy Paint Brush Title -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
  <style>
    .wispy-title {
      font-family: 'Caveat Brush', cursive;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header Banner (Blue Theme + Wispy Brush Font Title) -->
  <header class="bg-blue-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold tracking-wide wispy-title">Vaxxy-Pad</h1>
        <p class="text-blue-100 text-sm mt-1">An Interactive Repository for Publicly Funded Immunization & Eligibility in Nova Scotia</p>
      </div>
      <div class="bg-blue-800 text-blue-100 text-xs px-3 py-1.5 rounded-md border border-blue-600">
        Source: Nova Scotia DHW / Canadian Immunization Guide
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <!-- Directory Filter Controls -->
    <section class="mb-6 flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4">
      <!-- Search Input -->
      <div class="relative flex-1">
        <input 
          type="text" 
          id="searchInput" 
          onkeyup="filterVaccines()" 
          placeholder="Search by vaccine, condition, or age (e.g., Mpox, Hepatitis, Grade 7)..." 
          class="w-full bg-white border border-slate-300 rounded-lg py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm"
        >
        <span class="absolute left-3 top-3 text-slate-400">🔍</span>
      </div>

      <!-- Category Filter Tabs -->
      <div class="flex gap-2 overflow-x-auto pb-1 md:pb-0">
        <button onclick="setCategory('all', this)" class="cat-btn bg-blue-700 text-white text-xs px-3 py-2 rounded-md font-medium">All Vaccines</button>
        <button onclick="setCategory('pediatric', this)" class="cat-btn bg-white border text-slate-700 text-xs px-3 py-2 rounded-md font-medium hover:bg-slate-100">Pediatric / Youth</button>
        <button onclick="setCategory('adult', this)" class="cat-btn bg-white border text-slate-700 text-xs px-3 py-2 rounded-md font-medium hover:bg-slate-100">Adult / Senior</button>
        <button onclick="setCategory('high-risk', this)" class="cat-btn bg-white border text-slate-700 text-xs px-3 py-2 rounded-md font-medium hover:bg-slate-100">High Risk</button>
      </div>
    </section>

    <!-- Vaccine Cards Grid -->
    <section id="vaccineGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Generated via JavaScript -->
    </section>
  </main>

  <script>
    // Vaccine Database from both Nova Scotia Publicly Funded Immunization Documents
    const vaccines = [
      {
        id: 'mmrv',
        abbreviation: 'MMRV',
        type: 'Measles, mumps, rubella and varicella',
        products: 'Priorix-Tetra®',
        categories: ['pediatric', 'high-risk'],
        eligibilityVerbatim: [
          'Routine immunization of children < 13 years of age. Children born 2006 and later are eligible for 2 doses.',
          'Infants 6 to <12 months of age who received 1 dose for travel still require a 2 dose schedule given after 12 months of age (and 3 months after previous dose).',
          'Pre-exposure for the following conditions if < 13 years of age, once non-acutely ill/immunocompetent: Hematopoietic stem cell transplant (HSCT), HIV, Immunosuppressive therapy, Solid organ transplant.'
        ],
        notesVerbatim: [
          'Do not give to children < 1 year of age.',
          'Do not give to individuals 13 years of age and older.',
          'Reconstitution required (reconstitute freeze dried powder with supplied diluent). Do not freeze diluent.',
          'Do not give within four weeks of TB testing, or the administration of another live vaccine.',
          'Can give with inactive vaccines (at separate anatomical sites using separate syringes) at any time interval.',
          'Live Vaccine Considerations: If pregnant, defer. Can give if chest feeding. Hold antiviral therapy (e.g., valacyclovir) for 24 hours prior and 14 days post vaccination. Hold salicylate therapy for 6 weeks post-vaccination.'
        ]
      },
      {
        id: 'mmr',
        abbreviation: 'MMR',
        type: 'Measles, mumps and rubella',
        products: 'MMR® II, Priorix®',
        categories: ['pediatric', 'adult', 'high-risk'],
        eligibilityVerbatim: [
          'Routine immunization of children <13 years of age if MMRV is contraindicated or not recommended.',
          'Infants 6 to <12 months of age traveling to a region where measles is endemic or where there is an active outbreak (1 dose). Still require routine 2-dose series given after 12 months of age.',
          'Adults born in or after 1970 who lack documentation of 2 doses of measles-containing vaccine, a history of lab confirmed measles infection, or lab evidence of immunity (2 doses, 4 weeks apart).',
          'Adults born before 1970 who are traveling to an endemic area and lack documentation or lab evidence of immunity (1 dose).',
          'Health Care Workers and Post-secondary students regardless of year of birth without evidence of immunity (2 doses, 4 weeks apart).'
        ],
        notesVerbatim: [
          'Reconstitution required (reconstitute freeze dried powder with supplied diluent). Do not freeze diluent.',
          'Live Vaccine Considerations: If pregnant, defer. Can give if chest feeding.',
          'Immunocompromised: Refer to Canadian Immunization Guide (CIG) for live vaccine recommendations.'
        ]
      },
      {
        id: 'var',
        abbreviation: 'Var',
        type: 'Varicella',
        products: 'Varivax®',
        categories: ['pediatric', 'adult', 'high-risk'],
        eligibilityVerbatim: [
          'Routine immunization of children not receiving MMRV.',
          'Individuals born 1996 to 2005: 1 dose.',
          'Individuals born 2006 and later: 2 doses.',
          'Pre-exposure high-risk: HSCT, HIV, Chronic Renal Disease, Cystic Fibrosis, Splenic Disorders, Nephrotic syndrome.',
          'Non-immune health care workers & post-partum individuals.'
        ],
        notesVerbatim: [
          'Reconstitution required (reconstitute freeze dried powder with supplied diluent). Do not freeze diluent.',
          'Live Vaccine Considerations: Defer if pregnant. Hold valacyclovir 24h prior and 14 days post-vaccination. Hold salicylate therapy for 6 weeks post-vaccination.'
        ]
      },
      {
        id: 'tdap',
        abbreviation: 'Tdap',
        type: 'Tetanus, Diphtheria, Acellular Pertussis',
        products: 'Adacel®, Boostrix®',
        categories: ['pediatric', 'adult'],
        eligibilityVerbatim: [
          'Grade 7 students (school-based immunization program).',
          'Pregnant individuals in EVERY pregnancy (ideally between 27 and 32 weeks, regardless of previous history).',
          'Unimmunized or incompletely immunized adults (18+), or adults due for a 10-year tetanus booster who have not received a dose of acellular pertussis in adulthood.'
        ],
        notesVerbatim: [
          'Pre-filled syringe formulation.',
          'Consider Tdap-IPV if status/records are incomplete or unknown.'
        ]
      },
      {
        id: 'td',
        abbreviation: 'Td',
        type: 'Tetanus & Diphtheria',
        products: 'Td Adsorbed',
        categories: ['adult'],
        eligibilityVerbatim: [
          'Adult booster every 10 years following 1 dose of Tdap received in adulthood.',
          'Post-exposure immunization and wound management.'
        ],
        notesVerbatim: [
          'Pre-filled syringe / single dose vial.',
          'Use Tetanus Post-Exposure Wound Management matrix for clinical decisions.'
        ]
      },
      {
        id: 'shingles',
        abbreviation: 'RZV',
        type: 'Herpes Zoster (Recombinant Shingles)',
        products: 'Shingrix®',
        categories: ['adult'],
        eligibilityVerbatim: [
          '2 lifetime doses, minimum of 2 months apart for individuals aged 65 years and older.'
        ],
        notesVerbatim: [
          'Reconstitution required (freeze-dried antigen component reconstituted with adjuvant suspension).',
          'If received Shingles vaccine prior to age 65, do not re-immunize.',
          'If prior dose was live zoster vaccine (Zostavax®), give complete 2-dose primary series of Shingrix® with a 1-year interval after Zostavax®.'
        ]
      },
      {
        id: 'pneumo',
        abbreviation: 'Pneu-C-20',
        type: 'Pneumococcal Conjugate 20-valent',
        products: 'Prevnar 20®',
        categories: ['adult', 'high-risk'],
        eligibilityVerbatim: [
          'Routine immunization for adults aged 65 years and older (1 dose).',
          'High-risk adults (18 to 64 years) with specified conditions: Immunosuppressive conditions, solid organ/HSCT, chronic heart/lung/liver/kidney disease, diabetes, CSF leak, cochlear implant, severe asthma requiring medical care in past year.'
        ],
        notesVerbatim: [
          'Pre-filled syringe.',
          'Single dose replaces previous Pneu-C-13 / Pneu-P-23 combined schedules for most eligible adult groups.'
        ]
      },
      {
        id: 'rsv',
        abbreviation: 'RSV',
        type: 'Respiratory Syncytial Virus (mRNA)',
        products: 'mRESVIA®',
        categories: ['adult'],
        eligibilityVerbatim: [
          '1 lifetime dose for individuals aged 75 years and older.'
        ],
        notesVerbatim: [
          'Pre-filled syringe.',
          'If received RSV vaccine prior to age 75, do not re-immunize.',
          'Consider deferring from other routine immunizations out of caution as per clinical guidance.'
        ]
      },
      {
        id: 'covid',
        abbreviation: 'COVID-19',
        type: 'COVID-19 mRNA Vaccine',
        products: 'Moderna, Pfizer-BioNTech',
        categories: ['pediatric', 'adult'],
        eligibilityVerbatim: [
          'Primary Series (6 months to 4 years): 2 doses, 8 weeks apart.',
          'Primary Series (5 years and older): 1 dose.'
        ],
        notesVerbatim: [
          'Multidose vials / Pre-filled syringes.',
          'Minimum 3 months interval between doses or following documented SARS-CoV-2 infection.'
        ]
      },
      {
        id: 'flu',
        abbreviation: 'Inf',
        type: 'Influenza (Trivalent / Adjuvanted)',
        products: 'Fluviral®, Fluad®',
        categories: ['pediatric', 'adult'],
        eligibilityVerbatim: [
          'Children 6 months to 8 years: 2 doses (4 weeks apart) if receiving influenza vaccine for the first time.',
          'Individuals 9 years of age and older: 1 dose annually.',
          'Fluad®: Authorized specifically for individuals aged 65 years and older.'
        ],
        notesVerbatim: [
          'Multidose vials / Pre-filled syringes.',
          'Fluad® is an adjuvanted formulation for enhanced immune response in older adults.'
        ]
      },
      {
        id: 'hahb',
        abbreviation: 'HAHB',
        type: 'Hepatitis A and B',
        products: 'Twinrix®',
        categories: ['high-risk'],
        eligibilityVerbatim: [
          '• Pre-exposure immunization for those at increased risk of infection or severe disease:',
          '  - Chronic liver disease (including hepatitis C, hepatitis B, cirrhosis)',
          '  - Hemophilia or receiving repeated blood/blood product transfusions',
          '  - Men who have sex with men (MSM)',
          '  - Illicit drug users',
          '  - Re-immunization following hematopoietic stem cell transplant (HSCT)',
          '• Post-exposure prophylaxis for eligible contacts following documented exposure.'
        ],
        notesVerbatim: [
          'Pre-filled syringe / Single dose vial.',
          'Standard 3-dose schedule: 0, 1, and 6 months.',
          'Accelerated 4-dose schedule available if rapid protection required.'
        ]
      },
      {
        id: 'ha',
        abbreviation: 'HA',
        type: 'Hepatitis A',
        products: 'Havrix®, Vaqta®',
        categories: ['high-risk'],
        eligibilityVerbatim: [
          '• Pre-exposure immunization for high-risk groups: Hemophilia, chronic liver disease, MSM, illicit drug users.',
          '• Post-exposure: Within 14 days of close contact exposure for eligible candidates.'
        ],
        notesVerbatim: [
          'Pre-filled syringe / Single dose vial.',
          '2-dose primary series spaced 6 to 36 months apart depending on manufacturer.'
        ]
      },
      {
        id: 'hb',
        abbreviation: 'HB',
        type: 'Hepatitis B',
        products: 'Engerix®-B, Recombivax HB®',
        categories: ['pediatric', 'high-risk'],
        eligibilityVerbatim: [
          '• Grade 7 students (school-based immunization program) and youth who missed Grade 7 doses.',
          '• High-risk groups: Chronic renal disease/dialysis, solid organ transplant, HSCT, HIV, health care workers, frequent blood product recipients, household or sexual contacts of acute/chronic HBV.',
          '• Infants born to HBV-infected mothers (1st dose + HBIG within 12 hours of birth).'
        ],
        notesVerbatim: [
          'Single dose vial / Pre-filled syringe.',
          'Dialysis patients require specific higher dosing formulations (e.g., Recombivax HB Dialysis or double Engerix-B doses).',
          'Post-vaccination serology testing recommended 1–4 months after last dose for high-risk cohorts.'
        ]
      },
      {
        id: 'hpv',
        abbreviation: 'HPV',
        type: 'Human Papillomavirus',
        products: 'Gardasil® 9',
        categories: ['pediatric', 'adult', 'high-risk'],
        eligibilityVerbatim: [
          '• Grade 7 school-based program & catch-up up to age 18.',
          '• Individuals ≤ 26 years of age: MSM, transgender individuals, HIV-positive, or immunocompromised.',
          '• Surgical management of high-grade cervical dysplasia (up to 45 years of age).'
        ],
        notesVerbatim: [
          'Pre-filled syringe.',
          '2-dose series if initial dose given prior to age 15.',
          '3-dose series (0, 2, 6 months) if initial dose given at age 15+ or if immunocompromised.'
        ]
      },
      {
        id: 'men-b',
        abbreviation: 'Men-B',
        type: 'Meningococcal B',
        products: 'Bexsero®, Trumenba®',
        categories: ['high-risk'],
        eligibilityVerbatim: [
          '• High-risk medical conditions: Asplenia or hyposplenia, complement deficiency, properdin or factor D deficiency, individuals receiving eculizumab or ravulizumab.',
          '• Post-exposure management for Serotype B invasive meningococcal disease (IMD) close contacts.'
        ],
        notesVerbatim: [
          'Pre-filled syringe.',
          'Bexsero®: 2 doses at least 4 weeks apart.',
          'Trumenba®: 2 or 3 doses depending on risk profile and timing.'
        ]
      },
      {
        id: 'men-c-acyw',
        abbreviation: 'Men-C-ACYW',
        type: 'Meningococcal Quadrivalent',
        products: 'MenQuadfi®, Nimenrix®',
        categories: ['pediatric', 'high-risk'],
        eligibilityVerbatim: [
          '• Grade 7 school-based program.',
          '• High-risk medical conditions: Asplenia, complement deficiency, HIV, HSCT, solid organ transplant, cochlear implants.',
          '• Post-exposure management for A, C, Y, W-135 IMD close contacts.'
        ],
        notesVerbatim: [
          'Single dose vial / Liquid solution.',
          'Booster doses required every 3–5 years for individuals with ongoing high-risk medical conditions.'
        ]
      },
      {
        id: 'mpox',
        abbreviation: 'SMV (mpox)',
        type: 'Modified vaccinia virus (for protection against mpox)',
        products: 'Imvamune®',
        categories: ['high-risk'],
        eligibilityVerbatim: [
          '• Pre-exposure: Men who have sex with men (MSM) with multiple or anonymous partners, sex workers, laboratory staff handling orthopoxviruses.',
          '• Post-exposure prophylaxis (PEP): Within 4 days (up to 14 days) of high-risk contact with a confirmed mpox case.'
        ],
        notesVerbatim: [
          'Single dose vial (Subcutaneous / Intradermal route).',
          '2-dose primary series given 28 days apart.',
          'Subcutaneous administration (0.5 mL) or intradermal (0.1 mL) based on supply and clinical guidance.'
        ]
      }
    ];

    let currentCategory = 'all';

    // Render Cards Function with Full Expandable Details
    function renderVaccines(data) {
      const grid = document.getElementById('vaccineGrid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-500 bg-white rounded-xl border border-slate-200">No vaccines match your search criteria.</div>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-shadow p-5 flex flex-col justify-between";

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">${item.abbreviation}</span>
                <h3 class="text-lg font-bold text-slate-900 mt-1">${item.type}</h3>
              </div>
              <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded border border-slate-200">${item.products}</span>
            </div>

            <!-- Preview Eligibility -->
            <div class="mb-4">
              <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Eligibility Summary</h4>
              <ul class="text-xs text-slate-700 space-y-1.5 pl-4 list-disc">
                ${item.eligibilityVerbatim.slice(0, 2).map(e => `<li>${e}</li>`).join('')}
              </ul>
            </div>

            <!-- Expandable Collapsible Section for Additional Text -->
            <div id="details-${item.id}" class="hidden mt-4 pt-4 border-t border-slate-200 space-y-4">
              <div>
                <h4 class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-2">Full Eligibility Criteria</h4>
                <ul class="text-xs text-slate-800 space-y-1.5 pl-4 list-disc bg-slate-50 p-3 rounded-lg border border-slate-200 whitespace-pre-line">
                  ${item.eligibilityVerbatim.map(e => `<li>${e}</li>`).join('')}
                </ul>
              </div>

              <div>
                <h4 class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-2">Notes & Live Vaccine Considerations</h4>
                <ul class="text-xs text-slate-800 space-y-1 pl-4 list-disc bg-slate-50 p-3 rounded-lg border border-slate-200">
                  ${item.notesVerbatim.map(c => `<li>${c}</li>`).join('')}
                </ul>
              </div>
            </div>
          </div>

          <!-- Bottom Action Controls -->
          <div class="pt-3 border-t border-slate-100 mt-4 bg-slate-50 -mx-5 -mb-5 p-4 rounded-b-xl flex justify-between items-center">
            <span class="text-xs text-slate-500 font-medium">Products: ${item.products}</span>
            <button 
              onclick="toggleDetails('${item.id}', this)" 
              class="text-xs font-bold text-blue-700 hover:text-blue-900 bg-white border border-blue-300 hover:border-blue-400 px-3 py-1.5 rounded-md shadow-sm transition-colors"
            >
              Show Full Details
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Toggle Details Expand/Collapse
    function toggleDetails(id, btn) {
      const target = document.getElementById(`details-${id}`);
      if (target.classList.contains('hidden')) {
        target.classList.remove('hidden');
        btn.textContent = 'Hide Details';
        btn.classList.add('bg-blue-50');
      } else {
        target.classList.add('hidden');
        btn.textContent = 'Show Full Details';
        btn.classList.remove('bg-blue-50');
      }
    }

    // Search and Filter Logic
    function filterVaccines() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = vaccines.filter(v => {
        const matchesCat = currentCategory === 'all' || v.categories.includes(currentCategory);
        const matchesSearch = v.abbreviation.toLowerCase().includes(searchTerm) ||
                              v.type.toLowerCase().includes(searchTerm) ||
                              v.products.toLowerCase().includes(searchTerm) ||
                              v.eligibilityVerbatim.some(e => e.toLowerCase().includes(searchTerm)) ||
                              v.notesVerbatim.some(n => n.toLowerCase().includes(searchTerm));
        return matchesCat && matchesSearch;
      });
      renderVaccines(filtered);
    }

    function setCategory(cat, btnElement) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-blue-700', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700');
      });
      btnElement.classList.remove('bg-white', 'text-slate-700');
      btnElement.classList.add('bg-blue-700', 'text-white');
      filterVaccines();
    }

    // Initial Load
    renderVaccines(vaccines);
  </script>
</body>
</html>
